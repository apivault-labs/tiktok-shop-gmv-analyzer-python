[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-shop-gmv-analyzer"
version = "0.1.0"
description = "Python SDK for TikTok Shop GMV Analyzer on Apify. Analyze TikTok Shop sellers, products, niches, and affiliate creators. Estimate GMV, profit, portfolio concentration, creator contribution, and product opportunities from public marketplace signals. No login or cookies. Pay per result from $5/1K."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ApiVault Labs" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]
keywords = ["tiktok-shop", "gmv", "seller-analysis", "creator-analysis", "affiliate-marketing", "product-research", "apify", "python-sdk"]

[project.urls]
Homepage = "https://github.com/apivault-labs/tiktok-shop-gmv-analyzer-python"
Documentation = "https://github.com/apivault-labs/tiktok-shop-gmv-analyzer-python#readme"
"Apify Actor" = "https://apify.com/apivault_labs/tiktok-shop-seller-product-creator-gmv-analyzer"
"Bug Tracker" = "https://github.com/apivault-labs/tiktok-shop-gmv-analyzer-python/issues"

[tool.setuptools.packages.find]
include = ["tiktok_shop_gmv_analyzer*"]
